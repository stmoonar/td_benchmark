run: {tag: tune_c3, seed: 42, warmup: 20, repeat: 50, output_root: results}
shape: {preset: und}
routing: {imbalance: {kind: none}}
dist: {nproc: 4, master_port: 29500, cuda_visible_devices: "0,1,2,3"}
env: {NVSHMEM_SYMMETRIC_SIZE: "4294967296", NVSHMEM_REMOTE_TRANSPORT: none, NVSHMEM_DISABLE_CUDA_VMM: "1", CUDA_DEVICE_MAX_CONNECTIONS: "1", C_INCLUDE_PATH: /usr/local/cuda/include, TRITON_PTXAS_PATH: /usr/local/cuda/bin/ptxas}
schemes:
  enabled: [c3]
  c3: {tunables: {fp8_rs_enabled: true, num_combine_sms: 8, num_reduce_sms_in_combine: 100}}
verify: {enabled: true, tolerances: {}}
profile: {torch_profiler: false, intra_kernel: true, nvtx: true}
log: {level: info, diagnostics: false}
sweep_axes:
  - {path: schemes.c3.tunables.num_combine_sms, values: [4, 8, 12]}
  - {path: schemes.c3.tunables.num_reduce_sms_in_combine, values: [64, 100, 128]}
