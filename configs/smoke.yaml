run:
  tag: smoke
  seed: 42
  warmup: 5
  repeat: 5
  output_root: results
shape:
  preset: v1
routing:
  imbalance:
    kind: none
dist:
  nproc: 4
  master_port: 29500
  cuda_visible_devices: "9,11,13,15"
env:
  NVSHMEM_SYMMETRIC_SIZE: "4294967296"
  NVSHMEM_REMOTE_TRANSPORT: none
  NVSHMEM_DISABLE_CUDA_VMM: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  C_INCLUDE_PATH: /usr/local/cuda/include
  TRITON_PTXAS_PATH: /usr/local/cuda/bin/ptxas
schemes:
  enabled: [a1, a2, b1, b2, b3, c1, c2, c3, c4, c5]
  a1:
    tunables: {}
  a2:
    tunables: {}
  b1:
    tunables: {n_chunks_gateup: 2, n_chunks_down: 4}
  b2:
    tunables: {n_chunks_gateup: 2, n_chunks_down: 4}
  b3:
    tunables: {n_chunks_gateup: 2, n_chunks_down: 4}
  c1:
    tunables: {}
  c2:
    tunables: {}
  c3:
    tunables: {fp8_rs_enabled: true}
  c4:
    tunables: {n_chunks_rs: 32, block_quant: true}
  c5:
    tunables: {n_chunks_rs: 32, block_quant: true}
verify:
  enabled: true
profile:
  torch_profiler: false
  intra_kernel: false
  nvtx: false
log:
  level: info
  diagnostics: false
sweep_axes: []
