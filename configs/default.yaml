# Full template for server runs. Smaller configs may override only the fields they need.
run:
  # tag is included in results/<timestamp>_<tag>/.
  tag: default
  # seed controls checkpoint, hidden input, and gate routing generation.
  seed: 42
  # Production timing should use warmup >= 20 and repeat >= 50 unless running smoke.
  warmup: 20
  repeat: 50
  output_root: results
shape:
  # preset expands to M/K/E/top_k/n_gateup/n_down/shared_experts.
  # n_gateup is the full fused gate+up dimension; n_down must equal n_gateup / 2.
  preset: und
routing:
  imbalance:
    # kind may be none, zipf, or hotspot; bias is applied to gate logits.
    kind: none
dist:
  # nproc must match the comma-separated dist.cuda_visible_devices count.
  nproc: 4
  master_port: 29500
  # CUDA_VISIBLE_DEVICES is derived from this field; do not duplicate it under env.
  cuda_visible_devices: "9,11,13,15"
env:
  # NVSHMEM_SYMMETRIC_SIZE is fixed at process startup; raise it for large M/server sweeps.
  NVSHMEM_SYMMETRIC_SIZE: "4294967296"
  # NVSHMEM_REMOTE_TRANSPORT may be none for local smoke or a server transport when enabled.
  NVSHMEM_REMOTE_TRANSPORT: none
  NVSHMEM_DISABLE_CUDA_VMM: "1"
  # CUDA_DEVICE_MAX_CONNECTIONS affects stream overlap and must be recorded in manifest.
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  C_INCLUDE_PATH: /usr/local/cuda/include
  # TRITON_PTXAS_PATH should point at the CUDA ptxas used by Triton compilation.
  TRITON_PTXAS_PATH: /usr/local/cuda/bin/ptxas
schemes:
  # schemes.enabled controls run order and which scheme rows appear in results.jsonl.
  enabled: [a1, a2, b1, b2, b3, c1, c2, c3, c4, c5]
  # b* tunables control chunk-level communication/compute overlap.
  b1: {tunables: {n_chunks_gateup: 2, n_chunks_down: 4}}
  b2: {tunables: {n_chunks_gateup: 2, n_chunks_down: 4}}
  b3: {tunables: {n_chunks_gateup: 2, n_chunks_down: 4}}
  # c* tunables map formerly fork/env-driven Triton-distributed choices into YAML.
  c3: {tunables: {fp8_rs_enabled: true, num_combine_sms: 8, num_reduce_sms_in_combine: 100}}
  c4: {tunables: {n_chunks_rs: 32, gemm_block_m: 128, gemm_block_n: 128, block_quant: true}}
  c5: {tunables: {n_chunks_rs: 32, gemm_block_m: 128, gemm_block_n: 128, block_quant: true}}
verify:
  # tolerances are filled after server calibration; local fallback rows remain SERVER-VERIFY.
  enabled: true
  tolerances: {}
profile:
  # Profile artifacts are written under profiles/torch, profiles/intra, and profiles/ncu.
  torch_profiler: false
  intra_kernel: false
  nvtx: true
log:
  # diagnostics are emitted outside timed regions and can be disabled for clean sweeps.
  level: info
  diagnostics: false
# sweep_axes is a cartesian product of dotted config paths and values.
sweep_axes: []
